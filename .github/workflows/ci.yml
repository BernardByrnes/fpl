name: FPL Prediction Engine CI

on:
  push:
    branches:
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches:
      - 'feature/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run authoritative unit tests
        run: python scripts/ci_run_pytest.py
